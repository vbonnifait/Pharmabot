<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" fill="none">
  <!-- Fond carré arrondi -->
  <rect x="2" y="2" width="56" height="56" rx="16" fill="#0066CC"/>
  <rect x="2" y="2" width="56" height="56" rx="16" fill="url(#grad)" opacity="0.3"/>

  <!-- Pilule inclinée à 45° -->
  <!-- Demi-gauche (blanc) -->
  <path d="M18.5 41.5 L30 30 L18.5 18.5 A8.5 8.5 0 0 0 18.5 41.5Z" fill="white"/>
  <!-- Demi-droit (blanc translucide) -->
  <path d="M41.5 18.5 L30 30 L41.5 41.5 A8.5 8.5 0 0 0 41.5 18.5Z" fill="white" opacity="0.6"/>
  <!-- Corps central de la pilule -->
  <rect x="20.5" y="20.5" width="19" height="19" rx="0" fill="none"/>
  <!-- Ligne de séparation centrale -->
  <line x1="18.5" y1="41.5" x2="41.5" y2="18.5" stroke="#0066CC" stroke-width="2" stroke-linecap="round"/>

  <!-- Petit point IA (bulle de chat) -->
  <circle cx="44" cy="16" r="7" fill="#00A878"/>
  <text x="44" y="20.5" font-family="Arial" font-size="9" font-weight="bold" fill="white" text-anchor="middle">AI</text>

  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="white"/>
      <stop offset="100%" stop-color="#0044AA"/>
    </linearGradient>
  </defs>
</svg>
